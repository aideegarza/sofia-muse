services:
  - type: web
    name: sofia-muse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: RETELL_API_KEY
        sync: false
      - key: SHEETS_WEBAPP_URL
        sync: false
      - key: SHEETS_TOKEN
        sync: false
      - key: TEST_TOKEN
        sync: false
      - key: MUSE_MODEL
        value: muse-spark-1.3
      - key: MUSE_REASONING_EFFORT
        value: low
